# Blueprint do Render — deploy gratuito, sem cartão.
# No painel: New > Blueprint > conecta este repositório (privado ok).
# As variáveis marcadas "sync: false" você preenche manualmente no painel.
services:
  - type: web
    name: mercado-albion
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --no-access-log: blinda contra segredo em querystring no log.
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --no-access-log
    envVars:
      # Versão do Python (psycopg[binary] tem wheels para 3.12)
      - key: PYTHON_VERSION
        value: "3.12.7"
      # CRÍTICO (auditoria jul/2026): a COLETA roda no GitHub Actions
      # (.github/workflows/coletor.yml), NÃO aqui. Sem esta env o vigia interno
      # ASSUME a coleta no vão entre jobs do Actions e volta a baixar da AODP
      # DE DENTRO DO RENDER — recriando a banda que suspendeu a plataforma. Com
      # =1 o Render só SERVE (banda ~0). Se a coleta parar, o /api/health marca
      # coleta_ok=false e o vigia externo (workflow) avisa.
      - key: ALBION_NO_WATCHDOG
        value: "1"
      # String de conexão do Supabase — use o POOLER (porta 6543, modo
      # Transaction). Cole no painel do Render (Environment).
      - key: DATABASE_URL
        sync: false
      # Token do /api/sweep — o Render gera um valor aleatório; copie-o para a
      # URL do cron (cron-job.org).
      - key: ALBION_SWEEP_TOKEN
        generateValue: true
      # Render serve HTTPS: cookie de sessão precisa do flag Secure.
      - key: ALBION_AUTH_COOKIE_SECURE
        value: "1"
      # O proxy do Render ANEXA o IP real do cliente ao FIM do X-Forwarded-For
      # — aqui é seguro confiar (o padrão do app é desligado: sem proxy à
      # frente, o header seria forjável).
      - key: ALBION_TRUST_PROXY
        value: "1"
      # Defina como o nome do admin (ex.: admin) só na PRIMEIRA subida: cria a
      # conta e mostra a senha temporária no Log. Depois remova esta variável.
      - key: ALBION_BOOTSTRAP_ADMIN
        sync: false
      # Token do bot do Discord (Developer Portal > Bot > Reset Token). Com ele
      # o bot sobe DENTRO deste serviço (24/7 via keep-alive do cron) e
      # provisiona sozinho o token de serviço. Vazio = bot desligado.
      - key: DISCORD_BOT_TOKEN
        sync: false
      # (Opcional) sync instantâneo dos comandos no seu servidor Discord.
      - key: DISCORD_GUILD_ID
        sync: false
      # (Opcional) canal onde o bot posta/edita, no boot, o guia com TODOS os
      # comandos (ex.: #comece-aqui). Idempotente: reencontra a própria mensagem
      # e edita (não duplica em redeploy). Sem a env, o guia sai só via /ajuda.
      - key: ALBION_GUIDE_CHANNEL_ID
        sync: false
      # (Opcional) base pública p/ os ícones/imagens dos embeds. O default já é
      # https://mercado-albion.onrender.com — só defina se o serviço tiver outro
      # nome/domínio (senão as thumbnails das builds dão 404).
      - key: ALBION_PUBLIC_URL
        sync: false
      # (Opcional) quadro semanal automático: canal onde o bot posta/edita a
      # mensagem + snowflake de um membro VINCULADO (define a org do quadro).
      - key: ALBION_BOARD_CHANNEL_ID
        sync: false
      - key: DISCORD_BOARD_USER_ID
        sync: false
