name: coletor-poda

# Poda DIÁRIA do banco (agrega snapshots antigos + apaga histórico além da
# janela) — job SEPARADO do sweep porque o sweep desliga a poda por-tick
# (cada job do Actions é um processo novo e a poda rodaria a cada job).
# Mantém o Postgres free (500 MB) magro. Requer o segredo DATABASE_URL.

on:
  schedule:
    - cron: '17 5 * * *'   # 1×/dia, 05:17 UTC
  workflow_dispatch: {}

concurrency:
  group: coletor-poda
  cancel-in-progress: false

jobs:
  poda:
    if: ${{ vars.COLETOR_ATIVO == '1' }}   # mesma chave do coletor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: poda diária
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python tools/collector_prune.py
