name: coletor-mercado

# Coleta de preços/histórico da AODP RODANDO AQUI (banda grátis e ilimitada do
# GitHub Actions), gravando direto no Postgres do Supabase — NÃO no Render.
# Motivo: o free do Render tem 5 GB/mês de banda e o coletor sozinho baixava
# ~25 GB/mês → suspensão (jul/2026). Tirando o download daqui, o Render fica
# só servindo (banda ~0) e nunca mais é suspenso por banda.
#
# Requer o segredo DATABASE_URL (Settings → Secrets and variables → Actions):
#   a string do POOLER do Supabase (porta 6543).
# Recomendado repo PÚBLICO (minutos ilimitados; o código não tem segredo).

on:
  schedule:
    # a cada 15 min, em minuto quebrado (foge do pico :00 onde o Actions atrasa)
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}   # botão "Run workflow" pra testar na hora

concurrency:
  group: coletor-mercado    # nunca dois sweeps sobrepostos
  cancel-in-progress: false

jobs:
  sweep:
    # só roda depois que você criar a variável COLETOR_ATIVO=1 (Settings →
    # Secrets and variables → Actions → Variables). Antes disso os disparos
    # agendados são pulados na hora (0 minuto gasto). Assim posso subir o
    # workflow agora sem ele falhar/gastar antes de você pôr o DATABASE_URL.
    if: ${{ vars.COLETOR_ATIVO == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # Diagnostico do segredo. Escreve o veredito como ANNOTATION (::error /
      # ::notice) e nao so' no log: o log do Actions exige LOGIN pra ler, a
      # anotacao e' legivel pela API publica. Sem isso, diagnosticar este
      # workflow de fora e' impossivel. Nunca imprime o valor (o repo e publico
      # e a string carrega a senha do banco).
      - name: conferir o segredo DATABASE_URL (nao revela o valor)
        env:
          SEGREDO: ${{ secrets.DATABASE_URL }}
          VARIAVEL: ${{ vars.DATABASE_URL }}
        run: |
          FALHOU=0
          erro() { echo "::error title=DATABASE_URL::$1"; FALHOU=1; }
          if [ -z "$SEGREDO" ]; then
            if [ -n "$VARIAVEL" ]; then
              erro "Criado na aba VARIABLES, nao em SECRETS. Apague a variavel (ela guarda a senha do banco em claro) e recrie em Settings > Secrets and variables > Actions > aba Secrets > New repository secret."
            else
              erro "Nao existe secret DATABASE_URL neste repositorio. Crie em Settings > Secrets and variables > Actions > aba Secrets > New repository secret, com o Name exatamente DATABASE_URL."
            fi
            exit 1
          fi
          echo "secrets.DATABASE_URL: PRESENTE (${#SEGREDO} caracteres)"
          case "$SEGREDO" in
            *'[YOUR-PASSWORD]'*|*'[SUA-SENHA]'*|*'[password]'*)
              erro "A string ainda tem o marcador [YOUR-PASSWORD] no lugar da senha. O Supabase copia a URI assim de proposito; troque pela senha real do banco (colchetes inclusive)." ;;
          esac
          case "$SEGREDO" in
            postgresql://*|postgres://*) : ;;
            *) erro "A string nao comeca com postgresql:// — foi copiada a linha errada do painel do Supabase." ;;
          esac
          case "$SEGREDO" in
            *:6543/*) echo "porta: 6543 (Transaction pooler) OK" ;;
            *:5432/*) erro "A string usa a porta 5432 (Direct connection). O runner do GitHub nao tem IPv6 e a conexao direta do Supabase e' so' IPv6 — use o Transaction pooler, porta 6543." ;;
            *) erro "Nao identifiquei a porta. A URI do Transaction pooler termina em :6543/postgres." ;;
          esac
          [ "$FALHOU" = "0" ] || exit 1
          echo "::notice title=DATABASE_URL::formato OK (${#SEGREDO} caracteres, prefixo postgresql://, porta 6543)"
      - name: tick de coleta (preços + histórico + killboard)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COLLECTOR_BUDGET_SEC: '480'
          COLLECTOR_BATCH: '200'
          ALBION_DB_SOFT_MB: '340'   # autolimite: corta histórico se o banco encher
        run: |
          CODE=0
          python tools/collector_tick.py > tick.log 2>&1 || CODE=$?
          cat tick.log
          if [ "$CODE" -ne 0 ]; then
            # Mesmo motivo do passo acima: publica a causa como anotacao, que se
            # le' sem login. Sanitiza qualquer string de conexao antes (o GitHub
            # ja mascara o segredo exato; isto cobre variacoes).
            RESUMO=$(tail -n 30 tick.log \
              | sed -E 's#postgres(ql)?://[^[:space:]"]*#<URL-DO-BANCO>#g' \
              | sed -E 's#(password|senha|pwd)=[^[:space:]"\&]*#\1=<oculta>#g' \
              | grep -v '^[[:space:]]*$' \
              | awk '{printf "%s ~ ", $0}' | cut -c1-1200)
            echo "::error title=tick de coleta falhou::${RESUMO}"
            exit "$CODE"
          fi
