# CI mínimo: roda a suíte unittest a cada push/PR. Sem rede externa nos testes
# (usam SQLite temporário e fixtures locais); o cache real (data/cache.db) não
# existe no runner — os testes que dependem dele já se protegem sozinhos.
name: tests

on:
  push:
    branches: ["main", "multi-inquilino-*", "pilot-*"]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar suíte
        env:
          PYTHONIOENCODING: utf-8
          ALBION_NO_AUTOCOLLECT: "1"
        # Suíte COMPLETA (discover pega todo tests/test_*.py). O -t . importa
        # 'tests' como pacote -> roda tests/__init__.py (desliga auth ANTES de
        # qualquer módulo carregar albion.config), tornando a ordem irrelevante.
        run: python -m unittest discover -s tests -t . -p "test_*.py" -v
