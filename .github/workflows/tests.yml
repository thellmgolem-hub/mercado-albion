# CI mínimo: roda a suíte unittest a cada push/PR. Sem rede externa nos testes
# (usam SQLite temporário e fixtures locais); o cache real (data/cache.db) não
# existe no runner — os testes que dependem dele já se protegem sozinhos.
name: tests

on:
  push:
    branches: ["main", "multi-inquilino-*", "pilot-*"]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar suíte
        env:
          PYTHONIOENCODING: utf-8
          ALBION_NO_AUTOCOLLECT: "1"
        run: python -m unittest tests.test_core tests.test_laborer tests.test_advisor -v
